<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人 AI 科研助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>个人 AI 科研助手</h1>
    <p>前沿雷达 · 论文精读 · AI 导师</p>
  </header>

  <div id="toast-area" aria-live="polite"></div>

  <main class="layout">
    <!-- 左栏（移动端为上半区）：论文列表 + 多选对比 + 添加论文 -->
    <div class="left-col">
      <section class="panel" id="papers-panel">
        <h2>论文列表 <button class="secondary" id="refresh-papers">刷新</button></h2>
        <ul id="paper-list"></ul>
        <p class="hint" id="papers-empty" hidden>暂无论文，请先在下方添加。</p>
        <p class="hint">勾选 2-5 篇可在下方生成对比；点击标题打开详情与精读笔记。</p>
      </section>

      <section class="panel" id="compare-panel">
        <h2>对比</h2>
        <div class="row">
          <input type="text" id="compare-question"
                 placeholder="对比问题（可选），如：这些方法的核心区别是什么" />
          <button id="compare-btn" disabled>生成对比</button>
        </div>
        <p class="hint" id="compare-hint">已选 0 篇（需 2-5 篇）。</p>
        <div id="compare-result"></div>
      </section>

      <section class="panel" id="upload-panel">
        <h2>添加论文</h2>
        <div class="row">
          <input type="file" id="pdf-file" accept="application/pdf,.pdf" />
          <button id="upload-btn">上传 PDF</button>
        </div>
        <div class="row">
          <input type="url" id="arxiv-url" placeholder="arXiv 链接或 ID，如 https://arxiv.org/abs/2401.00001" />
          <button id="arxiv-btn">导入 arXiv</button>
        </div>
        <div class="row">
          <input type="text" id="import-path" placeholder="服务器上的文件夹路径（批量导入其中全部 PDF）" />
          <button id="import-btn">批量导入</button>
        </div>
        <div class="progress-wrap" id="import-progress" hidden>
          <div class="progress-bar"><div id="import-bar-fill"></div></div>
          <div class="progress-text" id="import-status-text"></div>
        </div>
      </section>
    </div>

    <!-- 右栏（移动端为下半区）：论文详情（精读）+ 问答对话 -->
    <div class="right-col">
      <section class="panel" id="detail-panel" hidden>
        <h2>论文详情
          <span class="detail-actions">
            <button class="secondary" id="detail-set-context">设为问答上下文</button>
            <button class="secondary" id="detail-refresh">刷新</button>
          </span>
        </h2>
        <div id="detail-body">
          <h3 id="detail-title"></h3>
          <div class="paper-meta" id="detail-meta"></div>
          <p class="abstract" id="detail-abstract"></p>
          <div class="row">
            <button id="interpret-btn">生成深度解读</button>
          </div>
          <div class="progress-wrap" id="interpret-progress" hidden>
            <div class="progress-bar"><div id="interpret-bar-fill"></div></div>
            <div class="progress-text" id="interpret-status-text"></div>
          </div>
          <div id="six-dim"></div>
          <h4 class="block-title" id="sections-title" hidden>章节解读</h4>
          <div id="sections-list"></div>
          <h4 class="block-title">笔记</h4>
          <div class="row">
            <select id="note-type">
              <option value="annotation">阅读批注</option>
              <option value="chat_summary">对话总结</option>
            </select>
          </div>
          <div class="row">
            <textarea id="note-content" placeholder="写点笔记…（支持 Markdown，安全渲染）"></textarea>
            <button id="add-note-btn">添加笔记</button>
          </div>
          <ul id="notes-list"></ul>
        </div>
      </section>

      <section class="panel" id="qa-panel">
        <h2>问答</h2>
        <div id="qa-context">当前上下文：全部论文</div>
        <div id="chat-log" aria-live="polite"></div>
        <form id="qa-form">
          <textarea id="question" placeholder="例如：这篇论文讲了什么？"></textarea>
          <button type="submit" id="ask-btn">提问</button>
        </form>
      </section>
    </div>
  </main>

  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
