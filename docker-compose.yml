services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal overrides: paths/hosts differ from the host-side .env
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      # Cached production model: avoid startup network probes/rate-limit sleeps.
      # Set HF_HUB_OFFLINE=0 for an intentional first model download.
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      # Host uid/gid owning ./data: docker auto-creates the volume dir as
      # root; the container entrypoint chowns the mount point to this id on
      # startup so the host user keeps write access (set HOST_UID in .env
      # for a non-1000 host user).
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - ./data:/app/data
      # bge-m3 HF cache: the model (~2.3GB) downloads on first app startup
      # via HF_ENDPOINT=https://hf-mirror.com and persists here across rebuilds.
      - ./data/hf:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8600:8000"
      - "100.64.0.7:8600:8000"
    depends_on:
      # wait for qdrant to actually serve, not just for the container to
      # exist — the app's own startup retry only covers short races
      qdrant:
        condition: service_healthy

  qdrant:
    # pinned by digest to the version actually running (server reports
    # "qdrant 1.20.2"; was :latest) so a floating tag can never change the
    # storage format under a rebuilt deployment. The local registry mirror
    # only serves already-cached tags, hence the digest (not "1.20.2") form.
    image: qdrant/qdrant@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # the image ships neither curl nor wget; bash's /dev/tcp probes the
      # REST port and greps the /readyz status line for "200"
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backup:
    build: ./ops
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Used when invoking /ops/backup.sh manually via docker exec; the
      # nightly cron job falls back to the same defaults baked into the script.
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/data
      - ./backups:/backups
    depends_on:
      - qdrant
