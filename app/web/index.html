<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研知 · 研究工作台</title><link rel="stylesheet" href="/workbench/workbench.css?v=1"></head><body>
<header class="work-top"><a class="work-brand" href="/">研知 <small>研究工作台</small></a><nav aria-label="功能导航"><button data-view="read" aria-current="page">读论文</button><button data-view="compare">论文比较</button><button data-view="schedules">定时任务</button><button data-view="library">论文库管理</button></nav><span id="work-connection" role="status">连接中…</span><button id="work-toggle-side" aria-label="展开或收起论文导航">☰</button></header>
<div class="work-layout"><aside class="work-sidebar"><button id="work-new" class="primary">＋ 新建论文阅读</button><button id="work-add">搜索 / 导入论文</button><div class="side-title"><h2>最近阅读</h2><button id="work-refresh" aria-label="刷新论文导航">↻</button></div><div id="recent-reading"></div><div class="side-title"><h2>论文领域</h2><button id="work-new-domain" aria-label="新增论文领域">＋</button></div><div id="domain-papers"></div><button class="side-schedule" data-view="schedules">◷ 定时任务</button><p class="muted sidebar-tip">阅读位置与会话自动保存<br>切换标签不会调用智能体</p></aside>
<main class="work-main"><section id="reading-workspace"><div class="paper-tab-row"><div id="paper-tabs" role="tablist" aria-label="打开的论文"></div><button id="paper-tab-add" aria-label="新增论文标签">＋</button><button id="work-home" title="回到阅读起始页">⌂</button></div><div id="reading-frames"></div><section id="work-welcome"><p class="eyebrow">YOUR RESEARCH, CONTINUED</p><h1>打开一篇论文，继续你的研究</h1><p class="muted">从左侧选择论文开始阅读，或创建一个新的研究任务。</p><form id="work-start-form"><label class="sr-only" for="work-question">这次想研究什么</label><textarea id="work-question" rows="3" maxlength="3000" placeholder="例如：阅读这篇论文，解释核心方法，并帮我检查实验结论…"></textarea><div class="start-actions"><button type="button" id="welcome-open">选择 / 导入论文</button><button class="primary">开始阅读 →</button></div></form><div class="welcome-templates"><h2>常用任务模板</h2><div id="welcome-templates"></div></div><div class="welcome-foot"><button id="welcome-compare">比较多篇论文</button><button id="welcome-discuss">独立研究讨论</button></div></section></section>
<section id="compare-workspace" hidden><div class="module-heading"><div><p class="eyebrow">COMPARE & CONNECT</p><h1>把方法放在一起看</h1><p class="muted">选择至少两篇论文，建立可延续的比较会话。</p></div><button id="new-comparison" class="primary">＋ 新建论文比较</button></div><div id="comparison-list"></div></section>
<section id="schedule-workspace" hidden><div class="module-heading"><div><p class="eyebrow">RESEARCH ROUTINES</p><h1>定时任务</h1><p class="muted">复用已有任务会话，按间隔交给现有智能体执行；新建任务默认暂停。</p></div><button id="new-schedule" class="primary">＋ 新建定时任务</button></div><div id="schedule-list"></div></section>
<section id="library-workspace" hidden><iframe id="library-frame" title="论文库管理"></iframe></section><section id="extra-workspace" hidden><button id="close-extra">← 返回工作台</button><iframe id="extra-frame" title="搜索、导入与会话"></iframe></section></main></div><div id="reader-toast" role="status" hidden></div><script type="module" src="/workbench/app.js?v=1"></script></body></html>
