<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研知 · 论文阅读</title><link rel="stylesheet" href="/vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="/reader/reader.css?v=2"><link rel="stylesheet" href="/workbench/dialog.css"></head><body>
<header class="reader-top"><a id="reader-top-back" href="/?view=library">← 论文库</a><strong id="paper-title">载入论文…</strong><span id="reader-status" role="status">连接中</span><button id="toggle-left">辅助面板</button><button id="toggle-chat">智能体</button></header>
<nav class="mobile-nav" aria-label="阅读分区"><button data-mobile="left">辅助</button><button data-mobile="pdf" aria-pressed="true">原文</button><button data-mobile="chat">智能体</button></nav>
<div class="reading-layout" data-mobile="pdf"><aside id="left-pane" class="aux-pane"><div class="aux-tabs" role="tablist" aria-label="辅助阅读"><button data-tab="outline" role="tab" aria-selected="true">章节</button><button data-tab="notes" role="tab" aria-selected="false">批注</button><button data-tab="highlights" role="tab" aria-selected="false">高亮</button><button data-tab="translations" role="tab" aria-selected="false">翻译</button><button data-tab="info" role="tab" aria-selected="false">信息</button></div>
<div class="aux-content"><section id="tab-outline" role="tabpanel"><h2>论文目录</h2><div id="outline-list"></div></section><section id="tab-notes" role="tabpanel" hidden><h2>阅读批注</h2><div id="note-context" class="quote-preview"></div><label for="note-text">我的想法</label><textarea id="note-text" rows="4" maxlength="8000" placeholder="写下你的理解、疑问或研究想法"></textarea><button id="save-note" class="primary">保存批注</button><div id="note-list"></div></section><section id="tab-highlights" role="tabpanel" hidden><h2>高亮与笔迹</h2><p class="muted">选择原文即可高亮，也可使用画笔。</p><div id="highlight-list"></div></section><section id="tab-translations" role="tabpanel" hidden><h2>选段翻译</h2><p class="muted">在原文选中文字，点击“翻译”。已完成的译文会保存并复用。</p><div id="translation-list"></div></section><section id="tab-info" role="tabpanel" hidden><h2>论文信息</h2><div id="paper-info"></div></section></div></aside><div id="left-resizer" class="pane-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整辅助阅读区宽度" aria-valuemin="140" aria-valuemax="600"></div>
<section id="pdf-pane" class="pdf-pane" aria-label="论文原文"><div class="reader-toolbar"><button id="previous-page" disabled aria-label="上一页">‹</button><label>页 <input id="page-number" disabled type="number" min="1" value="1" aria-label="当前页码"></label><span id="page-total">/ —</span><button id="next-page" disabled aria-label="下一页">›</button><label class="sr-only" for="zoom">缩放</label><select id="zoom" disabled><option value="fit">适合宽度</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><span class="separator"></span><button id="select-tool" disabled aria-pressed="true">选择</button><button id="pen-tool" disabled aria-pressed="false">画笔</button><button id="erase-tool" disabled aria-pressed="false">橡皮</button><label class="sr-only" for="annotation-color">批注颜色</label><select id="annotation-color" disabled><option value="#f5d76e">黄色</option><option value="#9ed8ff">蓝色</option><option value="#a9dfbf">绿色</option><option value="#f4b6d5">粉色</option></select></div><div id="pdf-scroll" class="pdf-scroll"><div id="pdf-pages"></div><div id="pdf-error" role="alert" hidden></div></div></section>
<div id="right-resizer" class="pane-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整智能体区域宽度" aria-valuemin="140" aria-valuemax="600"></div><aside id="chat-pane" class="chat-pane"><div class="chat-heading"><div><p class="eyebrow">RESEARCH AGENT</p><h2>与论文一起讨论</h2></div><button id="new-reading-session" disabled>新会话</button></div><label class="session-label" for="reader-session">当前论文的任务会话</label><select id="reader-session"></select><p id="session-detail" class="muted"></p><div id="reader-chat" class="reader-chat" aria-live="polite"></div><form id="reader-composer"><div class="reader-compose-tools"><label class="sr-only" for="reader-template">提问模板</label><select id="reader-template"><option value="">选择提问模板</option></select><button type="button" id="reader-new-template" title="新增提问模板">＋ 模板</button><label class="image-upload">＋ 图片<input id="reader-image-files" disabled type="file" accept="image/png,image/jpeg" multiple></label></div><div id="reader-attachments"></div><div id="quote-attachment" hidden></div><label class="sr-only" for="reader-question">向智能体提问</label><textarea id="reader-question" disabled maxlength="3000" rows="3" placeholder="问一个问题，或先选中原文加入对话…" required></textarea><div class="send-row"><span id="agent-state" role="status">发送后才调用智能体</span><button class="primary" id="reader-send" disabled>发送</button></div></form></aside></div>
<div id="selection-actions" class="selection-actions" role="toolbar" aria-label="选区操作" hidden><button data-selection="explain">解释</button><button data-selection="translate">翻译</button><button data-selection="highlight">高亮</button><button data-selection="note">批注</button><button data-selection="chat">加入对话</button></div><div id="reader-toast" role="status" hidden></div><script src="/md.js" defer></script><script type="module" src="/reader/main.js?v=2"></script></body></html>
