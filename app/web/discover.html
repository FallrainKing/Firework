<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研知 · 搜索与导入论文</title><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/discovery.css"></head><body>
<header class="topbar"><a class="brand" href="/?view=library">← 论文库</a><span>搜索与添加论文</span><a href="/">任务会话</a></header><main class="discovery-main"><h1>找到论文，带回自己的研究库</h1><p class="muted">搜索与导入使用现有智能体的专用能力；浏览结果、管理分类和打开原文不调用模型。</p><div class="discovery-layout"><section class="discovery-panel"><h2>搜索论文</h2><form id="search-form"><label for="search-query">关键词、题目或研究方向</label><input id="search-query" required maxlength="200" placeholder="例如 diffusion policy"><label for="search-source">检索来源</label><select id="search-source"><option value="arxiv">arXiv</option><option value="crossref">Crossref（含期刊与会议书目）</option><option value="both">两个来源</option></select><button class="primary" id="search-submit">搜索</button></form><p id="search-status" role="status"></p><a id="search-session" hidden>打开这次搜索会话 ↗</a><div id="search-results"></div></section>
<section class="discovery-panel"><h2>添加论文</h2><label for="import-collection">保存到分类</label><select id="import-collection"><option value="">未分类</option></select><p class="muted">同一论文可在库中归入多个分类；相同 PDF 或标识会复用已有条目。</p><form id="source-form"><label for="source-value">arXiv ID / DOI / 公开 PDF 链接</label><input id="source-value" required maxlength="2000" placeholder="2406.09246 或 10.… 或 https://…pdf"><button class="primary" id="source-submit">识别并导入</button></form><p class="fine">DOI 首先保存书目信息。无法取得全文时，可继续上传 PDF。链接需为可直接下载的公开 HTTPS PDF。</p><form id="upload-form"><label for="pdf-files">上传本地 PDF（支持多选）</label><input id="pdf-files" type="file" accept="application/pdf,.pdf" multiple required><p class="fine">每个文件不超过 30MB、300 页；一次最多 8 个。保留原始文件并建立文本索引。</p><label for="attach-paper">补充到已有论文（可选）</label><input id="attach-paper" type="number" min="1" placeholder="填写仅有书目信息的论文编号"><button id="upload-submit">上传并入库</button></form><p id="import-status" role="status"></p><h3>导入记录</h3><div id="import-list"></div></section></div><div id="reader-toast" role="status" hidden></div></main><script type="module" src="/discovery.js"></script></body></html>
