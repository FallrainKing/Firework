server {
    listen 172.20.0.157:80;
    server_name paper.matchesai.vip;
    return 301 https://paper.matchesai.vip$request_uri;
}
server {
    listen 172.20.0.157:443 ssl;
    server_name paper.matchesai.vip;
    ssl_certificate /etc/nginx/ssl/matchesai.vip/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/matchesai.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Application session authentication protects research data.
    auth_basic off;

    client_max_body_size 64m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:18600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
