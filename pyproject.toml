[project]
name = "research-assistant"
version = "0.1.0"
description = "Personal AI research assistant: paper radar, deep reading, AI mentor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "cryptography>=43",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-multipart>=0.0.20",  # multipart uploads (POST /api/papers/upload)
    # torch must be the CPU build (no GPU on this host): install with
    # pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
